name: OrangeFox hero2lte Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev gcc-multilib g++-multilib \
        libc6-dev-i386 lib32z1-dev libncurses5-dev \
        x11proto-core-dev libx11-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip python3 bc

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox source
      run: |
        mkdir fox
        cd fox

        repo init \
        -u https://gitlab.com/OrangeFox/manifest.git \
        -b fox_12.1

        mkdir -p .repo/local_manifests

        cp ../local_manifests/roomservice.xml \
        .repo/local_manifests/

        repo sync -c --force-sync --no-clone-bundle -j$(nproc)

    - name: Build recovery
      run: |
        cd fox

        export ALLOW_MISSING_DEPENDENCIES=true

        source build/envsetup.sh

        lunch twrp_hero2lte-eng

        mka recoveryimage

    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-hero2lte
        path: fox/out/target/product/hero2lte/*.img
