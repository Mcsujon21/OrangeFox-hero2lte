name: Mcsujon OrangeFox hero2lte fox11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            bc bison build-essential flex \
            zip unzip rsync ccache \
            libssl-dev libelf-dev \
            openjdk-11-jdk

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OrangeFox fox11
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox"
          cd "$GITHUB_WORKSPACE/fox"
          repo init \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b fox_11.0

      - name: Add hero2lte device and kernel
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/roomservice.xml <<'MANIFEST'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project
              name="OrangeFoxRecovery/device_samsung_hero2lte"
              path="device/samsung/hero2lte"
              remote="github"
              revision="fox_11.0" />
            <project
              name="morogoku/android_kernel_samsung_universal8890"
              path="kernel/samsung/universal8890"
              remote="github"
              revision="twrp" />
          </manifest>
          MANIFEST

      - name: Sync source
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          repo sync -c --force-sync \
            --no-clone-bundle --no-tags -j2

      - name: Verify device configuration
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          test -s device/samsung/hero2lte/BoardConfig.mk
          test -s device/samsung/hero2lte/twrp_hero2lte.mk
          grep -n 'TARGET_PREBUILT_KERNEL\|TARGET_PREBUILT_DT' \
            device/samsung/hero2lte/BoardConfig.mk
          ls -lh device/samsung/hero2lte/prebuilt/

      - name: Build recovery
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=hero2lte
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_SAMSUNG_DEVICE=1
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_hero2lte-eng
          mka adbd recoveryimage

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mcsujon-OrangeFox-hero2lte-fox11
          path: |
            fox/out/target/product/hero2lte/recovery.img
            fox/out/target/product/hero2lte/*.tar
            fox/out/target/product/hero2lte/*.zip
          if-no-files-found: warn
          retention-days: 7
