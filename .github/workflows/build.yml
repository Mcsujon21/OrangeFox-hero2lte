name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncursesw5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync Source & Build
        run: |
          export PATH="~/bin:$PATH"
          mkdir ~/OrangeFox
          cd ~/OrangeFox
          git config --global user.name "YourName"
          git config --global user.email "you@example.com"
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_11.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          git clone https://github.com/OrangeFox-Recovery-Devices/device_samsung_hero2lte.git -b fox_11.0 device/samsung/hero2lte
          source build/envsetup.sh
          lunch omni_hero2lte-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Zip
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-hero2lte
          path: ~/OrangeFox/out/target/product/hero2lte/*.zip
