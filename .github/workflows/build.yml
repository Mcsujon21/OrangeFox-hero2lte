name: OrangeFox hero2lte fox16

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl repo bc bison build-essential \
        flex gperf libxml2-utils python3 unzip zip


    - name: Initialize OrangeFox
      run: |
        mkdir fox
        cd fox

        repo init \
        -u https://gitlab.com/OrangeFox/Manifest.git \
        -b fox_16.0


    - name: Add device tree
      run: |
        cd fox

        mkdir -p .repo/local_manifests

        cp ../local_manifests/roomservice.xml \
        .repo/local_manifests/


    - name: Sync source
      run: |
        cd fox

        repo sync \
        -c \
        --force-sync \
        --no-clone-bundle \
        -j$(nproc)


    - name: Build OrangeFox
      run: |

        cd fox

        source build/envsetup.sh

        export ALLOW_MISSING_DEPENDENCIES=true

        lunch twrp_hero2lte-eng

        mka recoveryimage


    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-hero2lte
        path: fox/out/target/product/hero2lte/*.img
