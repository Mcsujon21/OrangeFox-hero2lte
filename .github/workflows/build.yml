name: Build OrangeFox hero2lte

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl python3 repo ccache

    - name: Check OrangeFox branches
      run: |
        git ls-remote --heads https://gitlab.com/OrangeFox/Manifest.git

    - name: Setup repo
      run: |
        mkdir fox
        cd fox

        repo init \
          -u https://gitlab.com/OrangeFox/Manifest.git

        mkdir -p .repo/local_manifests

        cp ../local_manifests/roomservice.xml \
        .repo/local_manifests/

    - name: Sync source
      run: |
        cd fox
        repo sync -c -j$(nproc) --force-sync

    - name: Show device tree
      run: |
        ls -la fox/device/samsung/hero2lte
