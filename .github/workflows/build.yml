name: OrangeFox hero2lte

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        git gnupg flex bison build-essential zip curl \
        zlib1g-dev gcc-multilib g++-multilib \
        libc6-dev-i386 lib32z1-dev \
        libncurses5-dev libxml2-utils xsltproc unzip bc python3

    - name: Setup repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox
      run: |
        mkdir fox
        cd fox

        repo init \
        -u https://gitlab.com/OrangeFox/manifest.git \
        -b fox_12.1

        mkdir -p .repo/local_manifests

        cp ../local_manifests/roomservice.xml \
        .repo/local_manifests/

        repo sync -c -j$(nproc) --force-sync

    - name: Build
      run: |
        cd fox

        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=hero2lte

        source build/envsetup.sh

        lunch twrp_hero2lte-eng

        mka recoveryimage

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-hero2lte
        path: fox/out/target/product/hero2lte/*.img
