name: OrangeFox hero2lte fox16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo apt clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          python3 \
          python-is-python3 \
          bc \
          bison \
          build-essential \
          flex \
          zip \
          unzip \
          rsync \
          ccache

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize OrangeFox
      run: |
        mkdir fox
        cd fox

        repo init \
          -u https://gitlab.com/OrangeFox/Manifest.git \
          -b fox_16.0

    - name: Add device tree
      run: |
        cd fox
        mkdir -p .repo/local_manifests

        cat > .repo/local_manifests/roomservice.xml <<'EOF'
        <manifest>
          <project 
          name="Mcsujon21/android_device_samsung_hero2lte"
          path="device/samsung/hero2lte"
          remote="github"
          revision="fox_16.0" />
        </manifest>
        EOF

    - name: Sync source
      run: |
        cd fox
        repo sync \
          -c \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          -j2

    - name: Build OrangeFox
      run: |
        cd fox
        source build/envsetup.sh
        lunch omni_hero2lte-eng
        mka recoveryimage

    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-hero2lte
        path: fox/out/target/product/hero2lte/*.img
