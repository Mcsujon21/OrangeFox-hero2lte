name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncursesw5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync Source & Build
        run: |
          export PATH="$HOME/bin:$PATH"
          mkdir -p /home/runner/OrangeFox
          cd /home/runner/OrangeFox
          
          git config --global user.name "Mcsujon21"
          git config --global user.email "mcsujon21@gmail.com"
          
          # Initialize Repo with fox_9.0 manifest
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_9.0
          
          # Fix dead references by overriding broken upstream repos
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/hero2lte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Remove broken default upstream paths -->
            <remove-project name="android_frameworks_base" />
            <remove-project name="android_system_core" />
            <remove-project name="vendor/recovery" />

            # Add working upstream sources
            <project path="frameworks/base" name="Minimal-TWRP/android_frameworks_base" revision="9.0" remote="github" />
            <project path="system/core" name="Minimal-TWRP/android_system_core" revision="9.0" remote="github" />
            <project path="vendor/recovery" name="OrangeFox/vendor_recovery" revision="fox_9.0" remote="gitlab" />
          </manifest>
          EOF

          # Sync source with error tolerance flags
          repo sync -c --force-sync --no-clone-bundle --no-tags --prune -j$(nproc) || repo sync -c --force-sync -j1
          
          # Clone Device Tree for hero2lte
          git clone https://github.com/OrangeFox-Recovery-Devices/device_samsung_hero2lte.git -b fox_9.0 device/samsung/hero2lte
          
          # Setup Environment & Build
          source build/envsetup.sh
          lunch omni_hero2lte-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Zip
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-hero2lte
          path: /home/runner/OrangeFox/out/target/product/hero2lte/*.zip
